# Failed TLS handshakes on the agent port (8444): scanners and clients without
# a valid device certificate. Enrolled agents with an expired certificate
# fail here too, so keep the threshold high and exempt your office networks.
[Definition]
failregex = http: TLS handshake error from \[?<ADDR>\]?:\d+:
ignoreregex =
journalmatch = _SYSTEMD_UNIT=limdm-server.service
