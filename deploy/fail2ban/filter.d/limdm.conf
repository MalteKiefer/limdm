# LiMDM console and enrollment failures (limdm-server JSON log in the journal).
# Matches failed local and OIDC sign ins and rejected enrollments.
[Definition]
failregex = "msg":"(?:local login failed|oidc login failed|enroll rejected)".*"remote":"\[?<ADDR>\]?"
ignoreregex =
journalmatch = _SYSTEMD_UNIT=limdm-server.service
