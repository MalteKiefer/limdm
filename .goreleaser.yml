# GoReleaser v2: https://goreleaser.com
version: 2
project_name: limdm

before:
  hooks:
    # Fail instead of silently changing dependencies at release time.
    - go mod tidy -diff

builds:
  - id: agent
    main: ./cmd/limdm-agent
    binary: limdm-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/maltekiefer/limdm/internal/agent.Version={{ .Version }}
      - -X github.com/maltekiefer/limdm/internal/agent.UpdatePubKey={{ envOrDefault "UPDATE_PUBKEY" "" }}
  - id: desktop
    main: ./cmd/limdm-desktop
    binary: limdm-desktop
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags: [-s -w]
  - id: cli
    main: ./cmd/limdm
    binary: limdm
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/maltekiefer/limdm/internal/agent.Version={{ .Version }}
  - id: server
    main: ./cmd/limdm-server
    binary: limdm-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/maltekiefer/limdm/internal/server.Version={{ .Version }}
      - -X github.com/maltekiefer/limdm/internal/server.ReleasePubKey={{ envOrDefault "UPDATE_PUBKEY" "" }}

archives:
  - id: agent
    ids: [agent, desktop, cli]
    formats: [tar.gz]
    name_template: "limdm-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, packaging/limdm-agent.service, scripts/install-agent.sh]
  - id: server
    ids: [server]
    formats: [tar.gz]
    name_template: "limdm-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, packaging/limdm-server.service, packaging/server.env.example]

nfpms:
  - id: agent
    ids: [agent, desktop, cli]
    package_name: limdm-agent
    homepage: https://github.com/MalteKiefer/limdm
    maintainer: Malte Kiefer <malte.kiefer@kiefer-networks.de>
    description: LiMDM device agent, declarative device management for Debian, Ubuntu, Fedora, CentOS, openSUSE, SLES, Arch (also Manjaro, EndeavourOS, CachyOS) and Alpine
    license: MIT
    formats: [deb, rpm, archlinux, apk]
    bindir: /usr/bin
    contents:
      - src: packaging/limdm-agent.service
        dst: /usr/lib/systemd/system/limdm-agent.service
        file_info:
          mode: 0o644
      - src: packaging/limdm-watchdog.service
        dst: /usr/lib/systemd/system/limdm-watchdog.service
        file_info:
          mode: 0o644
      - src: packaging/limdm-watchdog.timer
        dst: /usr/lib/systemd/system/limdm-watchdog.timer
        file_info:
          mode: 0o644
      - src: packaging/limdm-watchdog.sh
        dst: /usr/lib/limdm/limdm-watchdog.sh
        file_info:
          mode: 0o755
      - src: packaging/limdm-agent.openrc
        dst: /etc/init.d/limdm-agent
        packager: apk
        file_info:
          mode: 0o755
      - src: packaging/limdm-pam-config
        dst: /usr/share/pam-configs/limdm
        packager: deb
        file_info:
          mode: 0o644
      - src: packaging/limdm-desktop-autostart.desktop
        dst: /etc/xdg/autostart/limdm-desktop.desktop
        file_info:
          mode: 0o644
      - src: packaging/limdm-desktop.service
        dst: /usr/lib/systemd/user/limdm-desktop.service
        file_info:
          mode: 0o644
      - src: packaging/limdm-recovery-key.desktop
        dst: /usr/share/applications/limdm-recovery-key.desktop
        file_info:
          mode: 0o644
      - src: packaging/limdm.desktop
        dst: /usr/share/applications/limdm.desktop
        file_info:
          mode: 0o644
      - src: packaging/limdm-desktop-ui
        dst: /usr/lib/limdm/limdm-desktop-ui
        file_info:
          mode: 0o755
      # translations of the GTK app, read as .po at runtime (docs/i18n.md);
      # the CLI, the tray and the agent embed theirs (internal/locale)
      - src: packaging/locale/*.po
        dst: /usr/share/limdm/locale/
        file_info:
          mode: 0o644
      - src: packaging/artwork/limdm.svg
        dst: /usr/share/icons/hicolor/scalable/apps/limdm.svg
        file_info:
          mode: 0o644
      - src: packaging/artwork/limdm-symbolic.svg
        dst: /usr/share/icons/hicolor/symbolic/apps/limdm-symbolic.svg
        file_info:
          mode: 0o644
      - dst: /etc/limdm
        type: dir
        file_info: {mode: 0o700}
      - dst: /var/lib/limdm
        type: dir
        file_info: {mode: 0o700}
    scripts:
      postinstall: packaging/agent-postinstall.sh
      preremove: packaging/agent-preremove.sh
      postremove: packaging/agent-postremove.sh
    # tools the agent calls; the agent also installs missing ones itself (deps.go).
    # Desktop tools are only suggested: servers must not pull in GTK.
    overrides:
      deb:
        dependencies: [osquery, systemd, util-linux, cryptsetup-bin, iproute2, procps, kmod, gpg, "openssl (>= 3)"]
        recommends: [unattended-upgrades, ufw, libpam-pwquality, auditd, nftables]
        suggests: [zenity, kdialog, libnotify-bin, dconf-cli, flatpak, python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1]
      # one rpm for Fedora and SUSE: hard dependencies only on names both use;
      # iproute, procps-ng and gnupg2 are named iproute2, procps and gpg2 on
      # SUSE, so they are weak (dnf and zypper install recommends by default)
      # openssl: the release signature needs OpenSSL 3 (install.sh); SUSE
      # names the package openssl-3, a rich dependency accepts either
      rpm:
        dependencies: [osquery, systemd, util-linux, cryptsetup, kmod, "(openssl >= 3 or openssl-3)"]
        recommends: [iproute, procps-ng, gnupg2, firewalld, audit, dnf-plugins-core, nftables]
        suggests: [zenity, kdialog, libnotify, dconf, flatpak, python3-gobject, gtk4, libadwaita]
      # osquery is not packaged for Arch and Alpine; the agent uses its native inventory there
      archlinux:
        dependencies: [systemd, util-linux, cryptsetup, iproute2, procps-ng, kmod, gnupg, shadow, pacman-contrib, "openssl>=3"]
      apk:
        dependencies: [openrc, findmnt, lsblk, runuser, cryptsetup, iproute2, procps, kmod, gnupg, shadow, bash, "openssl>=3"]
    # pacman and apk run separate hooks on upgrade (post_upgrade, .post-upgrade);
    # the agent update relies on the restart in the post install script
    archlinux:
      scripts:
        postupgrade: packaging/agent-postinstall.sh
    apk:
      scripts:
        postupgrade: packaging/agent-postinstall.sh
  - id: server
    ids: [server]
    package_name: limdm-server
    homepage: https://github.com/MalteKiefer/limdm
    maintainer: Malte Kiefer <malte.kiefer@kiefer-networks.de>
    description: LiMDM management server
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/limdm-server.service
        dst: /usr/lib/systemd/system/limdm-server.service
        file_info:
          mode: 0o644
      - src: packaging/server.env.example
        dst: /etc/limdm-server/server.env
        type: config|noreplace
        file_info: {mode: 0o640}
      - src: packaging/limdm-server.sysusers
        dst: /usr/lib/sysusers.d/limdm-server.conf
    scripts:
      preinstall: packaging/server-preinstall.sh
      postinstall: packaging/server-postinstall.sh

dockers_v2:
  - id: server
    ids: [server]
    dockerfile: Dockerfile.release
    images: ["ghcr.io/maltekiefer/limdm-server"]
    tags: ["{{ .Version }}", "{{ if not .Prerelease }}latest{{ end }}"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: limdm-server
      org.opencontainers.image.source: https://github.com/MalteKiefer/limdm
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore"
      - "^ci"

release:
  prerelease: auto
  extra_files:
    - glob: scripts/install-agent.sh
