<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}LiMDM{{end}}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
{{if .Sess.Email}}
<div class="shell">
  <aside class="side">
    <div class="brand"><img src="/static/logo.svg" alt=""> LiMDM</div>
    <nav class="nav" aria-label="Main">
      <a href="/" {{if eq .Page "overview"}}class="on" aria-current="page"{{end}}>Overview</a>
      <a href="/devices" {{if or (eq .Page "devices") (eq .Page "device")}}class="on" aria-current="page"{{end}}>Devices</a>
      <a href="/compliance" {{if eq .Page "compliance"}}class="on" aria-current="page"{{end}}>Compliance</a>
      <span class="group">Configuration</span>
      <a href="/library" {{if or (eq .Page "library") (eq .Page "item")}}class="on" aria-current="page"{{end}}>Library</a>
      <a href="/blueprints" {{if or (eq .Page "blueprints") (eq .Page "blueprint")}}class="on" aria-current="page"{{end}}>Blueprints</a>
      <a href="/tokens" {{if eq .Page "tokens"}}class="on" aria-current="page"{{end}}>Enrollment</a>
      <span class="group">Evidence</span>
      <a href="/audit" {{if eq .Page "audit"}}class="on" aria-current="page"{{end}}>Audit log</a>
    </nav>
    <form class="who" method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <div class="name" title="{{.Sess.Email}}">{{.Sess.Email}}</div>
      <div class="role">{{.Sess.Role}}</div>
      <button>Sign out</button>
    </form>
  </aside>
  <main class="main">{{template "content" .}}</main>
</div>
{{else}}
<main class="login-shell">{{template "content" .}}</main>
{{end}}
</body>
</html>
