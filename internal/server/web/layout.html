<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}LiMDM{{end}}</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="login-shell">{{template "content" .}}<div class="login-foot"><span class="version">LiMDM {{version}}</span><div class="langs"><a href="/lang/de" {{if eq lang "de"}}aria-current="true"{{end}}>DE</a><a href="/lang/en" {{if eq lang "en"}}aria-current="true"{{end}}>EN</a></div></div></main>
</body>
</html>
{{/* an error notice: translated text, the technical message folded away */}}
{{define "err"}}{{with .}}{{$m := errmsg .}}<div class="notice error" role="alert">{{$m.Text}}{{with $m.Detail}}<details class="err-detail"><summary>{{t "Technical detail"}}</summary><code>{{.}}</code></details>{{end}}</div>{{end}}{{end}}
