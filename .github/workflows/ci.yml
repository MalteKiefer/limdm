name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # setup-go installs the go directive's version; Go then switches to the
  # toolchain directive's patched release, verified against sum.golang.org.
  GOTOOLCHAIN: auto
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - name: Cross compile for every supported architecture
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o /dev/null ./...
          done
      - run: go vet ./...
      # The runner image ships PostgreSQL; using it avoids an unpinned service image.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE limdm LOGIN SUPERUSER PASSWORD 'limdm'" -c "CREATE DATABASE limdm OWNER limdm"
      - name: Unit and integration tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
        env:
          LIMDM_TEST_DATABASE_URL: postgres://limdm:limdm@127.0.0.1:5432/limdm
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  web:
    name: Console app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - name: API types are generated from openapi.json
        run: npm run api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm test
      - name: Build, bundle budget, committed build is current
        run: |
          npm run build
          git add -N ../internal/server/webapp/dist
          git diff --exit-code --stat -- ../internal/server/webapp/dist || { echo "run make web and commit internal/server/webapp/dist"; exit 1; }
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE limdm LOGIN SUPERUSER PASSWORD 'limdm'" -c "CREATE DATABASE limdm_e2e OWNER limdm"
      - run: npx playwright install --with-deps chromium
      - name: End to end tests (CSP, sign in)
        run: npm run e2e
        env:
          LIMDM_E2E_DATABASE_URL: postgres://limdm:limdm@127.0.0.1:5432/limdm_e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: check

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        run: pipx run zizmor==1.33.1 --persona pedantic --format github .
        env:
          GH_TOKEN: ${{ github.token }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comment the review summary on a failing PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # MIT is this project's license; the rest are the permissive set Go modules use.
          # LicenseRef-scancode-google-patent-license-golang is the PATENTS grant of golang.org/x modules.
          # npm (web/): OFL-1.1 for the bundled fonts; BlueOak, 0BSD, Unlicense, CC0, Python-2.0 (argparse)
          # and CC-BY-4.0 (caniuse-lite data) are permissive build tool licenses.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, LicenseRef-scancode-google-patent-license-golang, OFL-1.1, BlueOak-1.0.0, 0BSD, Unlicense, CC0-1.0, Python-2.0, CC-BY-4.0
