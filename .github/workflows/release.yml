name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Protected by required reviewers and the v* tag ruleset.
    environment: release
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push the server image to ghcr.io
      id-token: write # sign the provenance attestation with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # Never restore a cache into a release build.
          cache: false
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      - name: Log in to ghcr.io
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require release keys
        # Agents built without UPDATE_PUBKEY refuse every self update, and
        # unsigned checksums would be refused by released agents.
        env:
          UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$UPDATE_PUBKEY" ] || { echo "::error::UPDATE_PUBKEY is not set"; exit 1; }
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::RELEASE_SIGNING_KEY is not set"; exit 1; }
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public Ed25519 key the agent accepts self updates from (limdm-server keygen).
          UPDATE_PUBKEY: ${{ vars.UPDATE_PUBKEY }}
      - name: Sign release checksums
        # Agents only install updates whose SHA256SUMS carry this signature.
        # A missing key fails the release instead of shipping unsigned sums.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::RELEASE_SIGNING_KEY is not set in the release environment"; exit 1; }
          sums=$(ls dist/*_SHA256SUMS)
          go run ./cmd/limdm-server sign -key-env RELEASE_SIGNING_KEY "$sums" > "$sums.sig"
          gh release upload "$GITHUB_REF_NAME" "$sums.sig"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*_SHA256SUMS
            scripts/install-agent.sh
      - name: Server image digest
        id: image
        run: |
          digest=$(jq -r '[.[] | select(.type == "Docker Image" or .type == "Docker Manifest") | .extra.Digest // empty] | first // empty' dist/artifacts.json)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/maltekiefer/limdm-server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
